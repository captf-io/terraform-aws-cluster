# trivy ignore file for `make scan` (trivy config). Every ignore needs a
# statement that says why the finding is acceptable (CONVENTIONS.md
# section 15), and paths so it cannot hide the same finding elsewhere:
#
# misconfigurations:
#   - id: <check id>
#     paths:
#       - <file>.tf
#     statement: >-
#       Why this is acceptable, in one or two sentences.

misconfigurations:
  - id: AWS-0090
    paths:
      - bootstrap_bucket.tf
    statement: >-
      The bootstrap bucket holds only payloads the controller rewrites (pools
      every token rotation); versioning would keep every superseded join
      token and control-plane CA key as a noncurrent version, and there is
      nothing to recover from one.
  - id: AWS-0132
    paths:
      - bootstrap_bucket_encryption.tf
    statement: >-
      SSE-S3 on purpose: nodes read their payload with no KMS permission, and
      who may read what is decided by the bucket policy (per node role and
      key prefix, TLS only), which a customer managed key would not narrow.
